<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uppercase Converter</title>
<style>
:root{--bg:#0b0e19;--card:#141a2b;--line:#252d43;--text:#fff;--muted:#929bb1;--accent:#a78bfa;--btn:#7c3aed;--btn2:#283148;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Thai",Arial,sans-serif;display:flex;justify-content:center;align-items:center;padding:20px;overflow-x:hidden;position:relative}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.45;z-index:0;animation:drift 14s ease-in-out infinite alternate}
.o1{width:300px;height:300px;background:#7c3aed;top:-80px;left:-80px}
.o2{width:260px;height:260px;background:#2563eb;bottom:-60px;right:-60px;animation-delay:-5s}
.o3{width:200px;height:200px;background:#db2777;top:45%;left:60%;animation-delay:-9s;opacity:.25}
@keyframes drift{to{transform:translate(60px,-50px) scale(1.25)}}
.p{position:fixed;bottom:-20px;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0;z-index:0;animation:rise linear infinite}
@keyframes rise{10%{opacity:.8}100%{transform:translateY(-110vh) translateX(30px);opacity:0}}
.container{position:relative;z-index:1;width:100%;max-width:500px;background:rgba(20,26,43,.88);backdrop-filter:blur(8px);padding:24px;border-radius:16px;border:1px solid var(--line);animation:enter .9s cubic-bezier(.2,.9,.3,1.2) both}
.container::before{content:"";position:absolute;inset:-2px;border-radius:18px;z-index:-1;background:conic-gradient(from var(--a,0deg),#7c3aed,#2563eb,#db2777,#7c3aed);animation:spin 5s linear infinite;opacity:.7}
.container::after{content:"";position:absolute;inset:0;border-radius:16px;background:#141a2b;z-index:-1}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
@keyframes enter{from{opacity:0;transform:translateY(40px) scale(.9) rotate(-2deg)}}
h2{margin:0 0 6px;font-size:24px;background:linear-gradient(90deg,#a78bfa,#60a5fa,#f472b6,#a78bfa);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:300% 0}}
p{color:var(--muted);font-size:14px;margin:6px 0 10px}
.row{display:flex;justify-content:space-between;align-items:center}
.count{font-size:13px;color:var(--accent);display:inline-block}
.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.5)}}
textarea{width:100%;height:140px;padding:14px;resize:vertical;background:#0b0e19;border:1px solid #303a55;border-radius:10px;color:#fff;outline:none;font-size:15px;margin-bottom:12px;transition:border-color .3s,box-shadow .3s,transform .3s}
textarea:focus{border-color:#8b5cf6;box-shadow:0 0 0 4px rgba(139,92,246,.25);transform:scale(1.01)}
#output.flash{animation:flash .45s}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(167,139,250,.8)}100%{box-shadow:0 0 0 14px rgba(167,139,250,0)}}
.buttons{display:flex;gap:10px}
button{flex:1;position:relative;overflow:hidden;padding:13px;border:none;border-radius:9px;background:var(--btn);color:#fff;font-weight:bold;font-size:14px;cursor:pointer;transition:transform .2s,box-shadow .2s}
button:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(124,58,237,.45)}
button:active{transform:scale(.94)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
button.secondary{background:var(--btn2)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:#7c3aed;padding:12px 22px;border-radius:30px;font-weight:bold;z-index:5;transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
.toast.show{transform:translate(-50%,0)}
.confetti{position:fixed;width:8px;height:12px;z-index:6;pointer-events:none;animation:fall 1.2s ease-out forwards}
@keyframes fall{to{transform:translate(var(--x),var(--y)) rotate(720deg);opacity:0}}
body::before{content:"";position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(139,92,246,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.09) 1px,transparent 1px);background-size:44px 44px;animation:grid 6s linear infinite;mask-image:radial-gradient(circle at 50% 50%,#000,transparent 75%)}
@keyframes grid{to{background-position:44px 44px}}
.star{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;z-index:0;animation:tw 2.5s ease-in-out infinite}
@keyframes tw{50%{opacity:.1;transform:scale(2.2)}}
.fl{position:fixed;z-index:0;font-size:22px;opacity:.5;animation:flo linear infinite}
@keyframes flo{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(40px,-60px) rotate(180deg)}100%{transform:translate(0,0) rotate(360deg)}}
.glow{position:fixed;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.35),transparent 65%);pointer-events:none;z-index:0;transition:left .15s,top .15s;left:50%;top:50%}
.container{transform-style:preserve-3d;transition:transform .15s ease-out;will-change:transform}
.container.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-14px) rotate(-2deg)}40%{transform:translateX(14px) rotate(2deg)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}
h2{display:inline-block;animation:shine 4s linear infinite,bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) scale(1.04)}}
#copy{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(124,58,237,0),0 0 24px rgba(167,139,250,.8)}}
textarea{animation:bd 6s linear infinite}
@keyframes bd{50%{border-color:#6d5bd0}}
textarea::placeholder{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.live{min-height:34px;margin:-2px 0 12px;display:flex;flex-wrap:wrap;gap:2px;overflow:hidden;max-height:70px}
.live span{display:inline-block;font-weight:bold;font-size:18px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both,wob 1.6s ease-in-out .5s infinite}
@keyframes pop{from{transform:scale(0) rotate(-180deg);opacity:0}}
@keyframes wob{50%{transform:translateY(-4px)}}
.sp{position:fixed;z-index:7;pointer-events:none;font-size:18px;animation:spk .9s ease-out forwards}
@keyframes spk{to{transform:translate(var(--x),var(--y)) scale(1.6) rotate(200deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<div class="container">
  <h2>UPPERCASE CONVERTER</h2>
  <p>ใส่ข้อความที่ต้องการแปลงเป็นตัวพิมพ์ใหญ่ค่ะ</p>
  <textarea id="input" placeholder="Enter your text..."></textarea>
  <div class="row"><p>ผลลัพธ์</p><span class="count" id="count">0 ตัวอักษร</span></div>
  <textarea id="output" placeholder="UPPERCASE RESULT..." readonly></textarea>
  <div class="live" id="live"></div>
  <div class="buttons">
    <button id="copy">COPY</button>
    <button id="clear" class="secondary">CLEAR</button>
  </div>
</div>
<div class="toast" id="toast">คัดลอกแล้วค่ะ ✓</div>

<script>
const input=document.getElementById("input"),output=document.getElementById("output"),count=document.getElementById("count"),toast=document.getElementById("toast");

for(let i=0;i<22;i++){const p=document.createElement("div");p.className="p";p.style.left=Math.random()*100+"vw";p.style.animationDuration=(6+Math.random()*8)+"s";p.style.animationDelay=(-Math.random()*10)+"s";p.style.width=p.style.height=(3+Math.random()*5)+"px";document.body.appendChild(p)}

input.addEventListener("input",()=>{
  output.value=input.value.toUpperCase();
  count.textContent=output.value.length+" ตัวอักษร";
  count.classList.remove("bump");void count.offsetWidth;count.classList.add("bump");
  output.classList.remove("flash");void output.offsetWidth;output.classList.add("flash");
});

function ripple(e){
  const b=e.currentTarget,r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement("span");
  d.className="ripple";d.style.width=d.style.height=s+"px";
  d.style.left=(e.clientX-r.left-s/2)+"px";d.style.top=(e.clientY-r.top-s/2)+"px";
  b.appendChild(d);setTimeout(()=>d.remove(),600);
}
document.querySelectorAll("button").forEach(b=>b.addEventListener("click",ripple));

function confetti(x,y){
  const colors=["#a78bfa","#60a5fa","#f472b6","#fbbf24","#34d399"];
  for(let i=0;i<28;i++){
    const c=document.createElement("div");c.className="confetti";
    c.style.left=x+"px";c.style.top=y+"px";c.style.background=colors[i%5];
    c.style.setProperty("--x",(Math.random()*300-150)+"px");
    c.style.setProperty("--y",(Math.random()*-250-40)+"px");
    document.body.appendChild(c);setTimeout(()=>c.remove(),1300);
  }
}

document.getElementById("copy").addEventListener("click",async e=>{
  if(!output.value)return;
  try{await navigator.clipboard.writeText(output.value)}
  catch{output.select();document.execCommand("copy")}
  toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1600);
  confetti(e.clientX,e.clientY);
});

document.getElementById("clear").addEventListener("click",()=>{
  input.value="";output.value="";count.textContent="0 ตัวอักษร";input.focus();
});

/* extra animation */
const glow=document.createElement("div");glow.className="glow";document.body.appendChild(glow);
for(let i=0;i<40;i++){const s=document.createElement("div");s.className="star";s.style.left=Math.random()*100+"vw";s.style.top=Math.random()*100+"vh";s.style.animationDelay=(Math.random()*2.5)+"s";document.body.appendChild(s)}
["🔠","✨","💜","⚡","🚀","⭐"].forEach((e,i)=>{const f=document.createElement("div");f.className="fl";f.textContent=e;f.style.left=(8+i*17)+"vw";f.style.top=(15+(i%3)*28)+"vh";f.style.animationDuration=(9+i*2)+"s";document.body.appendChild(f)});
const card=document.querySelector(".container");
window.addEventListener("pointermove",e=>{
  glow.style.left=e.clientX+"px";glow.style.top=e.clientY+"px";
  const r=card.getBoundingClientRect(),x=(e.clientX-(r.left+r.width/2))/window.innerWidth,y=(e.clientY-(r.top+r.height/2))/window.innerHeight;
  card.style.transform="perspective(900px) rotateY("+(x*14)+"deg) rotateX("+(-y*14)+"deg)";
});
window.addEventListener("pointerleave",()=>{card.style.transform=""});
const live=document.getElementById("live"),hues=[270,220,320,40,150];
function sparkle(){
  const r=input.getBoundingClientRect(),em=["✨","⭐","💫","💜"];
  for(let i=0;i<4;i++){const s=document.createElement("div");s.className="sp";s.textContent=em[(Math.random()*4)|0];
    s.style.left=(r.left+20+Math.random()*(r.width-40))+"px";s.style.top=(r.top+r.height-30)+"px";
    s.style.setProperty("--x",(Math.random()*120-60)+"px");s.style.setProperty("--y",(-40-Math.random()*90)+"px");
    document.body.appendChild(s);setTimeout(()=>s.remove(),900)}
}
input.addEventListener("input",()=>{
  live.innerHTML="";
  [...output.value.slice(-36)].forEach((ch,i)=>{const s=document.createElement("span");s.textContent=ch===" "?"\u00a0":ch;
    s.style.color="hsl("+hues[i%5]+",90%,72%)";s.style.animationDelay=(i*.03)+"s,"+(i*.1)+"s";live.appendChild(s)});
  sparkle();
});
document.getElementById("clear").addEventListener("click",()=>{live.innerHTML="";card.classList.remove("shake");void card.offsetWidth;card.classList.add("shake")});
</script>
</body>
</html>
